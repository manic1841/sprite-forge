<!doctype html>
<html lang="en" data-type="software" data-radius="sharp" data-ground="sage" data-buttons="pill">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Workbench — sprite-forge</title>
    <meta name="description"
        content="Cut a Recording on the store: mark a Segment, repair the frames and commit a Clip. The workbench runs on the local dev server.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#141a18">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/system.css">
    <link rel="stylesheet" href="assets/ui/base.css">
    <!-- The app sheet is split by layer and region. Order is the cascade:
         tokens/base → shell chrome → one file per region → errors → responsive
         → dialogs. Keep the files in this order. -->
    <link rel="stylesheet" href="styles/00-base.css">
    <link rel="stylesheet" href="styles/10-shell.css">
    <link rel="stylesheet" href="styles/20-chrome.css">
    <link rel="stylesheet" href="styles/30-rail.css">
    <link rel="stylesheet" href="styles/40-stage.css">
    <link rel="stylesheet" href="styles/50-filmstrip.css">
    <link rel="stylesheet" href="styles/60-inspector.css">
    <link rel="stylesheet" href="styles/61-inspector-cut.css">
    <link rel="stylesheet" href="styles/70-draft.css">
    <link rel="stylesheet" href="styles/80-align.css">
    <link rel="stylesheet" href="styles/90-errors.css">
    <link rel="stylesheet" href="styles/98-responsive.css">
    <link rel="stylesheet" href="styles/99-dialogs.css">
    <style>
        /*
  The page owns the frame (a slim bar and the full viewport); the workbench owns
  everything under it. No marketing sections, no scrolling page: the app is the
  page.
*/
        :root {
            --p-bg: #161c1a;
            --p-surface: #1f2725;
            --p-ink: #e3e2da;
            --p-muted: #aab0ab;
            --p-accent: #9fc7b8;
            --p-accent-ink: #161c1a;
            /* the action is the accent: without these the kit's blue default
               paints every primary button and every focus ring */
            --p-action: #9fc7b8;
            --p-action-ink: #161c1a;
            --font-display: "Instrument Sans", system-ui, sans-serif;
            --font-text: "Instrument Sans", system-ui, sans-serif;
            --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        }

        html,
        body {
            height: 100%;
        }

        body {
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            background: #141a18;
            color: var(--p-ink);
            font: 400 13px/1.5 var(--font-text);
        }

        .wb-page__bar {
            /* the kit's .nav is a fixed marketing bar: it stays fixed here too, so
               the workbench below it is the whole screen rather than a band under a
               bar */
            position: fixed;
            inset: 0 0 auto;
            z-index: 5;
            height: 44px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            border-bottom: 1px solid color-mix(in oklab, var(--p-ink) 12%, transparent);
            background: var(--p-surface);
            font-size: 13px;
        }

        /* the bar's pad is on the bar, so its .wrap is the content line and every
           box inside it starts on it */
        .wb-page__bar .wrap {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: none;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .wb-page__mark {
            font-weight: 500;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }

        /* the bar is 44px tall, so its links are too: a thumb target, not a
           16px line of text */
        .wb-page__mark,
        .wb-page__back {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
        }

        /* the first Tab stop, hidden over the bar until it is focused */
        .wb-page__skip {
            position: absolute;
            top: 6px;
            left: 0;
            z-index: 6;
            padding: 4px 10px;
            border-radius: 6px;
            background: var(--p-action);
            color: var(--p-action-ink);
            transform: translateY(-200%);
        }

        .wb-page__skip:focus-visible {
            transform: none;
        }

        .wb-page__crumb {
            color: var(--p-muted);
        }

        /* the page's one heading: the route, not the product (the mark is the
           product and it links home) */
        .wb-page__title {
            margin: 0;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        /* what the route is for, kept beside the name so the heading names the
           category; dropped where the bar is short */
        .wb-page__kind {
            color: var(--p-muted);
        }

        .wb-page__store {
            margin-left: auto;
            font: 400 11.5px/1.4 var(--font-mono);
            color: var(--p-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40ch;
        }

        .wb-page__back {
            flex: none;
            padding: 3px 12px;
            border: 1px solid color-mix(in oklab, var(--p-ink) 24%, transparent);
            border-radius: 999px;
            color: var(--p-muted);
        }

        .wb-page__back:hover {
            color: var(--p-ink);
        }

        /* the shell is the app frame now, not a section in a page: it is the whole
           screen under the bar, so the kit's section rhythm goes and its top
           pad is the bar's own height. It is full bleed to the window on the
           sides and the foot too (no gutter), and its regions carry the page's
           16px content line instead */
        .wb-shell.ui {
            box-sizing: border-box;
            height: 100svh;
            padding: 44px 0 0;
            margin-top: 0;
            border-radius: 0;
            box-shadow: none;
        }

        /* the app is full bleed: it runs to the window on both sides rather than
           standing in the site's gutters, so the kit container's width and centring
           go (the `.wrap` stays for the checker's one-child structure) */
        .wb-shell .wrap {
            width: 100%;
            max-width: none;
            margin-inline: 0;
            height: 100%;
        }

        @media (max-width: 639px) {
            .wb-page__store,
            .wb-page__crumb {
                display: none;
            }

            /* the route's title truncates before it wraps or meets the back link */
            .wb-page__title {
                flex: 1 1 auto;
                min-width: 0;
                font-size: 14px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            /* the bar has no room for both: the mark already says the name, so
               the line keeps what the route is for */
            .wb-page__name {
                display: none;
            }
        }

        /* under this the words go too: the title needs the room, and the arrow
           still says the way back */
        @media (max-width: 400px) {
            .wb-page__back {
                width: 44px;
                justify-content: center;
                padding-inline: 0;
            }

            .wb-page__back-label {
                display: none;
            }

            .wb-page__back::before {
                content: "←";
                font-size: 15px;
                line-height: 1;
            }
        }

        /* the stacked layout is taller than a phone, so the page scrolls there */
        @media (max-width: 859px) {
            body {
                display: block;
                height: auto;
                min-height: 100dvh;
                overflow: auto;
            }

            .wb-page__bar {
                position: sticky;
                top: 0;
                z-index: 5;
            }

            /* the sheet's own `.wb-shell.ui` is one screen already; here the stacked
               layout owns the frame instead (an id out-specifies it). Content is
               taller than a phone, so the section holds the fold and scrolls its
               own stacking: the bars stay put and no strip is cut by a cap. */
            #main > .wb-shell.ui {
                height: calc(100svh - 44px);
                min-height: calc(100svh - 44px);
                padding-top: 0;
                overflow: auto;
            }
        }
    </style>
</head>

<body class="ui">
    <header class="nav wb-page__bar">
        <div class="wrap">
            <a class="wb-page__skip" href="#app">Skip to the workbench</a>
            <a class="wb-page__mark" href="/">sprite-forge</a>
            <span class="wb-page__crumb">/</span>
            <h1 class="wb-page__title"><span class="wb-page__name">sprite-forge workbench — </span><span class="wb-page__kind">pixel animation tool</span></h1>
            <span class="wb-page__store" data-wb-store></span>
            <a class="wb-page__back" href="/" aria-label="Back to site"><span class="wb-page__back-label">Back to site</span></a>
        </div>
    </header>
    <main id="main">
        <section class="wb-shell ui">
            <div class="wrap wb-fallback-mount" id="app" data-wb-mount>
                <div class="wb-fallback">
                    <p><b>Starting the workbench…</b></p>
                    <p class="muted">It reads the store through the local server. If this stays, start it with
                        <code>SPRITE_FORGE_STORE=./store pnpm web</code> and reload.
                    </p>
                </div>
            </div>
        </section>
    </main>
    <script type="module" src="workbench.js"></script>
</body>

</html>
